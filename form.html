<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Oquest - Formulário</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-6 font-sans">

    <div class="max-w-md mx-auto">
        
        <!-- <a href="index.html" class="inline-flex items-center text-slate-500 text-sm font-medium mb-4 hover:text-blue-600 transition-colors">
            <i data-lucide="chevron-left" class="w-5 h-5 mr-1"></i>
            Voltar ao Dashboard
        </a> -->

        <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/60 p-6 sm:p-8 border border-slate-100">

            <form id="oquest-form" class="flex flex-col gap-5">
                
                <input type="hidden" id="p1">
                <input type="hidden" id="p2">
                <input type="hidden" id="p3">

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <label for="phone" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Número para contacto:</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="tel"
                        inputmode="numeric" 
                        pattern="[0-9]*"
                        autocomplete="tel-national"
                        required
                        placeholder="Ex: 912345678"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                    >
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <label for="ocorrencia_text" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 ml-1">Descrição do Problema</label>
                    <textarea id="ocorrencia_text" rows="4" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none" placeholder="Descreva a avaria."></textarea>
                </div>

                <div class="space-y-4 mb-2">
                    <button type="button" id="btn-audio" class="w-full flex items-center justify-center gap-3 bg-slate-800 text-white py-4 rounded-xl font-semibold active:bg-red-600 transition-colors">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                        <span id="audio-text">Gravar Áudio</span>
                    </button>
                    <audio id="audio-preview" controls class="hidden w-full mt-2"></audio>

                    <button type="button" id="btn-video" class="w-full flex items-center justify-center gap-3 bg-slate-100 text-slate-800 py-4 rounded-xl font-semibold border-2 border-slate-200 active:bg-slate-200 transition-colors">
                        <i data-lucide="video" class="w-5 h-5"></i>
                        <span id="video-text">Gravar Vídeo</span>
                    </button>
                    <video id="camera-live" autoplay muted playsinline class="hidden w-full rounded-xl bg-black mt-2"></video>
                    <video id="video-preview" controls class="hidden w-full rounded-xl mt-2 shadow-md"></video>
                </div>

                <div class="!mt-2 text-center"> 
                    <div class="inline-flex items-center gap-2 mb-4 px-2">
                        <p class="text-[11px] sm:text-xs text-slate-600 font-medium">
                            Pode colocar descrição ou enviar áudio ou enviar vídeo
                        </p>
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-100 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
                        <i data-lucide="send" class="w-5 h-5"></i>
                        Enviar Relatório
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
