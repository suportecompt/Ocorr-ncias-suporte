<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-6 sm:p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/60 w-[95%] max-w-sm text-center border border-slate-100">
        
        <div class="mb-6 flex justify-center">
            <img src="logo.png" alt="Logo Empresa" class="h-14 sm:h-16 w-auto object-contain">
        </div>

        <div class="mb-8">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2 leading-tight">
                Bem vindo !
            </h1>
        </div>

        <div class="flex flex-col gap-4">
            
            <a href="form.html" class="flex items-center justify-center gap-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 sm:py-4 px-4 rounded-2xl transition-all active:scale-[0.97] shadow-lg shadow-blue-100">
                <i data-lucide="file" class="w-5 h-5 flex-shrink-0 opacity-90"></i>
                <span class="text-base sm:text-lg">Pedido de intervenção</span>
            </a>
            
            <div class="flex flex-col">
                <p class="text-[10px] sm:text-xs text-emerald-600 font-medium italic mb-2 text-center">
                    Utilize apenas cuando instruído pelos nossos técnicos
                </p>
                
                <button id="btn-video-live" class="flex items-center justify-center gap-3 bg-slate-100 text-slate-400 font-semibold py-3.5 sm:py-4 px-4 rounded-2xl transition-all cursor-not-allowed opacity-70">
                    <i data-lucide="video" class="w-5 h-5 flex-shrink-0 opacity-90"></i>
                    <span class="text-base sm:text-lg">Videochamada</span>
                </button>
            </div>

        </div>
    </div>

    <footer class="fixed bottom-6 w-full text-center px-4">
        <div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-2 text-xs sm:text-sm text-slate-500 font-bif">
            <a href="tel:+351919844399" class="hover:text-blue-600 transition-colors">+351 919 844 399</a>
            <span class="opacity-30">|</span>
            <a href="mailto:geral@suporte.com.pt" class="hover:text-blue-600 transition-colors">geral@suporte.com.pt</a>
            <span class="opacity-30">|</span>
            <a href="https://suporte.com.pt" target="_blank" class="hover:text-blue-600 transition-colors">suporte.com.pt</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="check-live.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Lucide icons
        lucide.createIcons();

        // Parse URL parameters from the QR code scan
        const params = new URLSearchParams(window.location.search);
        const p1 = params.get('p1');
        const p2 = params.get('p2');
        const p3 = params.get('p3');

        // If any parameter exists, save it temporarily in local storage for the form
        if (p1 || p2 || p3) {
            localStorage.setItem('qr_p1', p1 || '');
            localStorage.setItem('qr_p2', p2 || '');
            localStorage.setItem('qr_p3', p3 || '');
            console.log("QR data successfully saved to localStorage.");
        }
    });
    </script>
</body>
</html>
